# The iPhone app's Xcode project, generated by XcodeGen (brew install xcodegen; then: xcodegen generate).
# Built by .github/workflows/build.yml (job "iPhone"): ios/prepare.sh fetches Python for iOS and the shared
# Python code first. The result is an unsigned .ipa that AltStore / SideStore sign with the user's Apple ID.
name: Sevbify
options:
  bundleIdPrefix: com.obamna1234
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SEVBIFY_VERSION: "dev"
targets:
  Sevbify:
    type: application
    platform: iOS
    sources:
      - path: Sevbify
        excludes:
          - "Info.plist"
      - path: app
        type: folder
        buildPhase: resources
      - path: app_packages
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obamna1234.sevbify
        PRODUCT_NAME: Sevbify
        INFOPLIST_FILE: Sevbify/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sevbify/Sevbify-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_TESTABILITY: YES
        FRAMEWORK_SEARCH_PATHS: "$(PROJECT_DIR)"
        HEADER_SEARCH_PATHS: "\"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers\""
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
    postBuildScripts:
      - name: Process Python libraries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Unsigned builds (for AltStore / SideStore) have no signing identity: sign ad hoc ("-") instead.
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          install_python Python.xcframework app app_packages
schemes:
  Sevbify:
    build:
      targets:
        Sevbify: all
    run:
      config: Debug
    archive:
      config: Release
