name: Health check

# Every day: tries each outside service Sevbify relies on (playlist-link import, Bandcamp, SoundCloud,
# Deezer, Apple's podcast directory, LRCLIB lyrics, song.link, yt-dlp). If one stops working - usually because the
# service changed something - this fails and GitHub emails the repository owner, so it gets fixed quickly.
# Also run by hand: Actions → Health check → Run workflow.

on:
  schedule:
    - cron: "17 21 * * *"        # 05:17 in Perth
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install (exact, checked versions)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-lock.txt
      - name: Check every service
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/health_check.py
      - name: Openly licensed songs for tests (information only, when run by hand)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/cc_probe.py || true
      - name: Spotify over-100-songs probe (information only)
        if: always() && github.event_name == 'workflow_dispatch'
        run: python tools/spotify_probe.py || true
