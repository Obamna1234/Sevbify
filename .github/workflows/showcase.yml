name: Showcase screenshots

# Started by hand (Actions -> Showcase screenshots -> Run workflow): runs the desktop app on a Linux test computer
# with real online data, takes a screenshot of each feature and records the screen, for a showcase video.
# Nothing is published: the pictures are kept as a download on the run for 7 days.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LANG: en_AU.UTF-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install VLC, a virtual screen and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q vlc libvlc-dev libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb ffmpeg \
            fonts-noto-core fonts-noto-color-emoji >/dev/null
      - name: Install Python packages (exact, checked versions)
        run: python -m pip install --require-hashes --no-deps -r requirements-lock.txt
      - name: Run the app, take screenshots and record the screen
        run: |
          mkdir -p showcase
          Xvfb :99 -screen 0 1600x960x24 &
          sleep 3
          export DISPLAY=:99 QT_QPA_PLATFORM=xcb
          ffmpeg -loglevel error -f x11grab -framerate 30 -video_size 1600x960 -i :99 \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p showcase/desktop.mp4 &
          FF=$!
          timeout 1800 python tools/showcase.py showcase || echo "::warning::showcase exited with $?"
          kill -INT $FF; wait $FF || true
          ls -la showcase
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: showcase
          path: showcase
          retention-days: 7

  # Saves the pictures to the "showcase" branch. Only this small job has a write token, and it runs no third-party
  # code: it downloads the pictures and pushes them.
  push:
    needs: showcase
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: showcase
          path: /tmp/s
      - name: Save to the showcase branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/s
          git init -q -b showcase
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Showcase ${GITHUB_SHA::7}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push -qf "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:showcase
