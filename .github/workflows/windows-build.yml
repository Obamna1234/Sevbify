name: Windows build & tests

# Runs on every push: tests the app on a real Windows machine with VLC
# installed, builds "Aurvo.exe", checks it starts, and uploads it
# as a downloadable artifact. Pushing a tag like v5.0 also publishes a Release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install VLC (64-bit)
        run: choco install vlc --no-progress -y

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run automated tests
        run: python -m pytest tests -v

      - name: Build Aurvo.exe
        run: >
          pyinstaller --noconfirm --windowed --name "Aurvo"
          --add-data "assets;assets"
          app.py

      - name: Check the .exe starts and loads the library
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Aurvo\Aurvo.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          $log = Join-Path $env:APPDATA "Aurvo\smoke-test.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed" }

      - name: Add read-me to the download
        shell: pwsh
        run: |
          Copy-Item README.md, CHANGELOG.md "dist\Aurvo\"
          Compress-Archive -Path "dist\Aurvo" -DestinationPath "Aurvo-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Aurvo-Windows
          path: dist/Aurvo/
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Aurvo-Windows.zip
          generate_release_notes: true
