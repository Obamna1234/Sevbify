name: End-to-end

# After every green "Build & test" on main (or by hand): takes the apps that build just made and uses them like a
# person would, on several systems: search, stream songs, pause/seek, make a playlist, download a song, follow
# and play a podcast, open Settings, close the app and check everything is still there after a restart.
# Every step is pass / FAIL / blocked here (a website refused GitHub's computers, e.g. YouTube's "not a bot"
# check) / skipped, with a screenshot. The results are on the run's summary page and in the artifacts.
# Windows 10 and 11 themselves aren't available on GitHub: Windows Server 2022 and 2025 are built on them.

on:
  workflow_run:
    workflows: ["Build & test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build & test run to check (empty = the newest green one on main)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e
  cancel-in-progress: false      # never stop a run that may be about to publish a release

jobs:
  pick:
    name: Which build
    # Also after a build where a check failed: the apps it built are still worth trying out.
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.r.outputs.run_id }}
      artifacts: ${{ steps.r.outputs.artifacts }}
      sha: ${{ steps.r.outputs.sha }}
      branch: ${{ steps.r.outputs.branch }}
      build_ok: ${{ steps.r.outputs.build_ok }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FROM_RUN: ${{ github.event.workflow_run.id }}
          ASKED: ${{ github.event.inputs.run_id }}
        run: |
          ID="${ASKED:-$FROM_RUN}"
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "run_id=$ID" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPO/actions/runs/$ID" --jq '"sha=\(.head_sha)\nbranch=\(.head_branch)\nbuild_ok=\(.conclusion == "success")"' >> "$GITHUB_OUTPUT"
          A=$(gh api "repos/$REPO/actions/runs/$ID/artifacts?per_page=100" --jq '[.artifacts[]|select(.expired|not)|.name]|join(",")')
          echo "artifacts=$A" >> "$GITHUB_OUTPUT"
          echo "Checking build run $ID (artifacts: $A)"

  desktop:
    name: ${{ matrix.name }}
    needs: pick
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows 10 (Server 2022)", os: windows-2022, artifact: Sevbify-Windows }
          - { name: "Windows 11 (Server 2025)", os: windows-2025, artifact: Sevbify-Windows }
          - { name: "Linux (Ubuntu 22.04)", os: ubuntu-22.04, artifact: Sevbify-Linux }
          - { name: "Linux (Ubuntu 24.04)", os: ubuntu-24.04, artifact: Sevbify-Linux }
          - { name: "macOS", os: macos-latest, artifact: Sevbify-macOS }
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Was this app built in that run?
        id: has
        env:
          LIST: ${{ needs.pick.outputs.artifacts }}
          WANT: ${{ matrix.artifact }}
        run: |
          case ",$LIST," in *",$WANT,"*) echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "yes=false" >> "$GITHUB_OUTPUT"
               echo "### ${{ matrix.name }}: not built in this run (macOS is built on release builds and [apple] commits)" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.has.outputs.yes == 'true'
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ needs.pick.outputs.run_id }}
          github-token: ${{ github.token }}
          path: pkg
      - name: Unpack
        if: steps.has.outputs.yes == 'true'
        run: |
          cd pkg
          case "${{ runner.os }}" in
            Windows) unzip -q Sevbify-Windows.zip; echo "APP=$(cygpath -w "$PWD/Sevbify/Sevbify.exe")" >> "$GITHUB_ENV" ;;
            macOS)   ditto -x -k Sevbify-macOS.zip .; echo "APP=$PWD/Sevbify.app/Contents/MacOS/Sevbify" >> "$GITHUB_ENV" ;;
            Linux)   tar xzf Sevbify-Linux.tar.gz; echo "APP=$PWD/Sevbify/Sevbify" >> "$GITHUB_ENV"
                     sudo apt-get update -q >/dev/null
                     sudo apt-get install -y -q vlc libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null ;;
          esac
          mkdir -p "$RUNNER_TEMP/data" "$GITHUB_WORKSPACE/report"
          echo "SEVBIFY_DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "SEVBIFY_E2E=1" >> "$GITHUB_ENV"
      - name: Use the app (first run)
        if: steps.has.outputs.yes == 'true'
        timeout-minutes: 42
        run: |
          set +e
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -Command "\$p = Start-Process -FilePath \"$APP\" -ArgumentList '--journey','$GITHUB_WORKSPACE\\report' -PassThru -Wait; exit \$p.ExitCode"
          else
            "$APP" --journey "$GITHUB_WORKSPACE/report"
          fi
          echo "exit code $?"
      - name: Close and open it again
        if: steps.has.outputs.yes == 'true'
        timeout-minutes: 8
        run: |
          set +e
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -Command "\$p = Start-Process -FilePath \"$APP\" -ArgumentList '--journey-again','$GITHUB_WORKSPACE\\report' -PassThru -Wait; exit \$p.ExitCode"
          else
            "$APP" --journey-again "$GITHUB_WORKSPACE/report"
          fi
          echo "exit code $?"
      - name: Results
        if: steps.has.outputs.yes == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "report")
          name = "${{ matrix.name }}"
          icons = {"pass": "✅ pass", "fail": "❌ FAIL", "blocked": "🚫 blocked here", "skipped": "⏭ skipped"}
          rows, failed, info = [], 0, {}
          for part in ("journey", "again"):
              try:
                  d = json.load(open(os.path.join(out, part + ".json"), encoding="utf-8"))
              except (OSError, ValueError):
                  rows.append(f"| {'First run' if part == 'journey' else 'Restart'} | ❌ FAIL | the app didn't finish (crashed or hung) |")
                  failed += 1
                  continue
              info = info or d.get("info", {})
              for s in d["steps"]:
                  failed += s["status"] == "fail"
                  rows.append(f"| {s['step']} | {icons.get(s['status'], s['status'])} | "
                              + s["detail"].replace("|", "/").replace("\n", " ")[:300] + " |")
              for t in d.get("dialogs", []):
                  rows.append(f"| A box popped up by itself | ⚠ note | {t.replace('|', '/')} |")
          if os.path.exists(os.path.join(out, "errors.txt")):
              rows.append("| Unexpected errors | ❌ FAIL | see errors.txt in the artifact (and below) |")
              failed += 1
              err = open(os.path.join(out, "errors.txt"), encoding="utf-8", errors="replace").read()
              print("::group::errors.txt")
              print(err[-6000:])
              print("::endgroup::")
          text = f"### {name}\n\n| Step | Result | Details |\n|---|---|---|\n" + "\n".join(rows) + \
                 f"\n\n{info.get('system', '')}\n"
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write(text)
          print(text)
          open(os.path.join(out, "failed.txt"), "w").write(str(failed))
          open(os.path.join(out, "journey.md"), "w", encoding="utf-8").write(text)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.has.outputs.yes == 'true'
        with:
          name: e2e-${{ matrix.os }}
          path: |
            report/*.png
            report/*.json
            report/*.md
            report/*.txt
            !report/downloads/**
          retention-days: 14
      - name: Pass or fail
        if: steps.has.outputs.yes == 'true'
        run: |
          N=$(cat report/failed.txt 2>/dev/null || echo 1)
          if [ "$N" != "0" ]; then echo "::error title=${{ matrix.name }}::$N step(s) failed. See the summary."; exit 1; fi

  android:
    name: ${{ matrix.name }}
    needs: pick
    if: contains(needs.pick.outputs.artifacts, 'Sevbify-Android')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          # A recent Android, plus updating from the last release over the top (your library must survive).
          - { name: "Android (emulator)", api: 34, report: e2e-android, upgrade: true }
          # The oldest Android Sevbify supports (minSdk 26 = Android 8): older phones are checked too.
          - { name: "Android 8 (oldest supported)", api: 26, report: e2e-android-8, upgrade: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Sevbify-Android
          run-id: ${{ needs.pick.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: The computer side of pairing (exact, checked version)
        run: |
          awk '/^pycryptodomex==/{f=1;print;next} f&&/^    --hash/{print;next} {f=0}' requirements-lock.txt > /tmp/pc.txt
          python3 -m pip install --break-system-packages --require-hashes --no-deps -r /tmp/pc.txt
      - name: The last release's Android app (to check updating from it keeps your library)
        if: matrix.upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The newest published release (a version being released now isn't published yet, so this is the one
          # people are updating from).
          TAG=$(gh api "repos/$REPO/releases?per_page=10" --jq '[.[]|select(.draft == false)][0].tag_name')
          echo "Updating from $TAG"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[]|select(.name=="Sevbify-Android.apk")|.browser_download_url' \
            | xargs -r -n1 curl -sSfL -o previous.apk || true
          ls -la previous.apk 2>/dev/null || echo "No previous Android release to update from"
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use the app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_e2e.sh
      - name: Results
        if: always()
        run: |
          cat android-journey/journey.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "### ${{ matrix.name }}: the check didn't finish" >> "$GITHUB_STEP_SUMMARY"
          cat android-journey/journey.md 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.report }}
          path: android-journey
          retention-days: 14
      - name: Pass or fail
        run: |
          python3 -c "
          import json, sys
          s = json.load(open('android-journey/journey.json'))['steps']
          bad = [x['step'] for x in s if x['status'] == 'fail']
          print('failed:', bad); sys.exit(1 if bad else 0)"

  publish:
    # Saves every report and screenshot to the e2e-reports branch (one folder per system), so they can be looked at
    # without downloading artifacts. Only this small job can write, and it runs no third-party code.
    name: Save reports
    needs: [pick, desktop, android]
    if: always() && needs.pick.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-*
          path: /tmp/r
      - name: Push
        env:
          TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.pick.outputs.run_id }}
        run: |
          cd /tmp/r
          { echo "# End-to-end reports"; echo; echo "Build run $RUN_ID, checked $(date -u '+%Y-%m-%d %H:%M UTC')"; echo
            for f in */journey.md; do echo "## ${f%%/*}"; cat "$f"; echo; done; } > README.md
          git init -q -b e2e-reports
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "End-to-end reports for build $RUN_ID"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push -qf "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:e2e-reports || echo "::error title=e2e-reports::push failed"

  release:
    # A new VERSION is only published when its build passed on every system AND every end-to-end test above
    # passed on what that build made (install, search, stream, podcasts, the new screens, updating from the last
    # release...). Anything red, and nothing is published.
    name: Release
    needs: [pick, desktop, android]
    if: >-
      needs.pick.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' &&
      needs.pick.outputs.build_ok == 'true' && needs.pick.outputs.branch == 'main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
      - name: Is this a new version to release?
        id: version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          # Only a plain version (5.0.0 or 5.0.0-beta.23) can name a release.
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$'; then
            echo "::error title=Release::VERSION isn't a plain version number"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$V")" ]; then echo "release=true" >> "$GITHUB_OUTPUT";
          else echo "release=false" >> "$GITHUB_OUTPUT"; fi
      # Only the app builds (Sevbify-*), never screenshots or test reports from jobs that run outside tools.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.version.outputs.release == 'true'
        with:
          path: artifacts
          pattern: Sevbify-*
          merge-multiple: true
          run-id: ${{ needs.pick.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Every download is there, and nothing else (the Android one needs the signing-key secrets)
        if: steps.version.outputs.release == 'true'
        run: |
          ls -la artifacts
          extra=$(cd artifacts && ls -A | grep -vxE 'Sevbify-(Windows|macOS)\.zip|Sevbify-Linux\.tar\.gz|Sevbify-Android\.apk|Sevbify-iOS\.ipa|Sevbify-Windows-Setup\.exe|Sevbify-Mac\.dmg' || true)
          if [ -n "$extra" ]; then echo "::error title=Release::unexpected files: $extra"; exit 1; fi
          if [ ! -f artifacts/Sevbify-Android.apk ]; then
            echo "::error title=Release::No release-signed Android app: add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets."
            exit 1
          fi
      # Signed updates (core/update_sign.py): the computer app only installs files signed with this key. The key
      # is a GitHub secret (and the owner's offline backup), never in the code. No key, no release.
      - name: Sign the downloads for the in-app updater
        if: steps.version.outputs.release == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          V: ${{ steps.version.outputs.version }}
        run: |
          # Only pycryptodomex, pinned with the same hashes as the app (requirements-lock.txt).
          python3 - <<'PY'
          import re
          text = open("requirements-lock.txt").read()
          m = re.search(r"^pycryptodomex==[^\n]*(?:\n +--hash=[^\n]*)*", text, re.M)
          open("/tmp/crypto-req.txt", "w").write(m.group(0).rstrip(" \\\n") + "\n")
          PY
          python3 -m venv /tmp/signenv
          /tmp/signenv/bin/pip install --quiet --require-hashes -r /tmp/crypto-req.txt
          /tmp/signenv/bin/python tools/sign_release.py "v$V" artifacts
      - name: Publish release (new VERSION or a pushed tag)
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ needs.pick.outputs.sha }}
          name: Sevbify ${{ format('v{0}', steps.version.outputs.version) }}
          body_path: RELEASE_NOTES.md
          # Versions with a dash (5.0.0-beta.1) are test versions: marked "Pre-release".
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            artifacts/Sevbify-*.zip
            artifacts/Sevbify-*.tar.gz
            artifacts/Sevbify-*.exe
            artifacts/Sevbify-*.dmg
            artifacts/Sevbify-*.apk
            artifacts/Sevbify-*.ipa
            artifacts/Sevbify-update-signatures.json
      - name: Update the AltStore / SideStore source (iPhone updates)
        if: (steps.version.outputs.release == 'true') && hashFiles('artifacts/Sevbify-iOS.ipa') != ''
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p /tmp/alt
          python3 tools/altstore_source.py "$V" artifacts/Sevbify-iOS.ipa RELEASE_NOTES.md /tmp/alt/source.json
          cd /tmp/alt
          git init -q -b altstore
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "AltStore source for $V"
          AUTH=$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader || true)
          git -c http.https://github.com/.extraheader="$AUTH" push -qf "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:altstore \
            || echo "::warning title=AltStore source::push failed"
