name: Android screenshots

# Started by hand (Actions -> Android screenshots -> Run workflow): builds the APK, runs it on an Android
# emulator, walks through the main screens and saves screenshots + screen recordings to the "screens" branch.
on:
  workflow_dispatch:

# The job that builds and runs the app (and third-party build tools) only gets a read-only token; a separate small
# job with no third-party code pushes the screenshots.
permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
      - name: Build the APK
        run: |
          gradle -p android assembleRelease --no-daemon -q      # debug-signed here: only for screenshots
          cp android/app/build/outputs/apk/release/app-release.apk Sevbify-Android.apk
      - name: Android lint (report only)
        continue-on-error: true
        run: |
          gradle -p android lintRelease --no-daemon -q || true
          mkdir -p screens
          cp android/app/build/reports/lint-results-release.txt screens/lint.txt 2>/dev/null || true
          cp android/app/build/reports/lint-results-release.html screens/lint.html 2>/dev/null || true
          ls android/app/build/reports || true
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -q ffmpeg >/dev/null
      - name: Run on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_screens.sh
      - name: Pack the screenshots
        if: always()
        run: |
          gzip -f screens/logcat.txt || true
          for f in $(ls screens/*.png 2>/dev/null | head -40); do echo "::notice title=shot::$(basename $f)"; done
          [ -f screens/steps.txt ] && echo "::notice title=steps::$(tr '\n' '|' < screens/steps.txt | cut -c1-3000)" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-screens
          path: screens
          retention-days: 7

  push:
    needs: screens
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-screens
          path: /tmp/s
      - name: Save to the screens branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd /tmp/s
          git init -q -b screens
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Android screenshots ${GITHUB_SHA::7}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            push -qf "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:screens
