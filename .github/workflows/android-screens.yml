name: Android screenshots

# Started by hand (Actions -> Android screenshots -> Run workflow): builds the APK, runs it on an Android
# emulator, walks through the main screens and saves screenshots + screen recordings to the "screens" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the APK
        run: |
          gradle -p android assembleRelease --no-daemon -q
          cp android/app/build/outputs/apk/release/app-release.apk Sevbify-Android.apk
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -q ffmpeg >/dev/null
      - name: Run on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_screens.sh
      - name: Save to the screens branch
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/s && cp -r screens/. /tmp/s/
          git checkout --orphan screens-new
          git rm -rq --cached . ; git clean -fdq -e screens
          rm -rf ./* .github 2>/dev/null; cp -r /tmp/s/. .
          rm -f logcat.txt
          git add -A && git commit -qm "Android screenshots ${GITHUB_SHA::7}"
          git push -f origin HEAD:screens
          for f in $(ls *.png | head -40); do echo "::notice title=shot::$f"; done
          echo "::notice title=steps::$(tr '\n' '|' < steps.txt | cut -c1-3000)"
