name: Build & test

# On every push: runs the automated tests on real Windows, macOS (Apple Silicon) and Linux machines (with VLC
# installed), builds the app for each, checks the built app actually starts, plays audio and loads a library,
# and uploads a download for each system.
# Releases: when the VERSION file holds a version that has no release yet (and the push is to main),
# a green build publishes it as a GitHub Release tagged v<VERSION>, with RELEASE_NOTES.md as its text.
# Pushing a tag like v5.0 by hand does the same.
on:
  push:
  workflow_dispatch:

# Read-only by default; only the Release job can publish.
permissions:
  contents: read

jobs:
  # Mac machines cost 10x the free minutes of a private repository, so macOS and iPhone are only built for a
  # release (new VERSION), when the workflow is started by hand, or when the commit message contains [apple].
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.p.outputs.apple }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          APPLE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then APPLE=true; fi
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "$(git ls-remote --tags origin "refs/tags/v$V")" ]; then APPLE=true; fi
          case "$MSG" in *"[apple]"*) APPLE=true ;; esac
          M='{"include":[{"name":"Windows","os":"windows-latest"},{"name":"Linux","os":"ubuntu-22.04"}'
          if [ "$APPLE" = true ]; then M="$M"',{"name":"macOS","os":"macos-latest"}'; fi
          echo "apple=$APPLE" >> "$GITHUB_OUTPUT"
          echo "matrix=$M]}" >> "$GITHUB_OUTPUT"
          echo "macOS and iPhone builds: $APPLE"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Windows and Linux (built on Ubuntu 22.04 so the app also runs on older Linux) always; macOS see "plan".
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Is this a new version to release?
        id: version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "$(git ls-remote --tags origin "refs/tags/v$V")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Will publish release v$V if everything passes."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "No new version (v$V already released, or not main)."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install VLC
        run: |
          case "${{ runner.os }}" in
            Windows) choco install vlc --no-progress -y ;;
            macOS)   brew install --cask vlc ;;
            Linux)   sudo apt-get update -q
                     sudo apt-get install -y -q vlc libvlc-dev libegl1 libgl1 libxkbcommon0 \
                       libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 libxcb-cursor0 ;;
          esac

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Run automated tests
        run: |
          set +e
          python -X faulthandler -m pytest tests -v -p no:cacheprovider > pytest.log 2>&1
          code=$?
          cat pytest.log
          if [ $code -ne 0 ]; then
            tail -n 60 pytest.log | python tools/annotate_tail.py "Tests exited with code $code"
          fi
          exit $code

      - name: Live online check (reports only, never fails the build)
        continue-on-error: true
        run: python tools/online_check.py

      - name: Live download check (reports only, never fails the build)
        continue-on-error: true
        run: python tools/download_check.py

      - name: Get Deno (YouTube's JavaScript engine for yt-dlp), checksum-checked
        run: |
          python - <<'PY'
          import hashlib, io, json, os, platform, re, stat, sys, urllib.request, zipfile
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Sevbify-CI"}), timeout=120).read()
          rel = json.loads(get("https://api.github.com/repos/denoland/deno/releases/latest"))
          arch = "aarch64" if platform.machine().lower() in ("arm64", "aarch64") else "x86_64"
          target = {"win32": "pc-windows-msvc", "darwin": "apple-darwin"}.get(sys.platform, "unknown-linux-gnu")
          name = f"deno-{arch}-{target}.zip"
          exe = "deno.exe" if os.name == "nt" else "deno"
          asset = next(a for a in rel["assets"] if a["name"] == name)
          data = get(asset["browser_download_url"])
          expected = (asset.get("digest") or "").removeprefix("sha256:")
          if not expected:
              side = next(a for a in rel["assets"] if a["name"] == name + ".sha256sum")
              expected = re.search(r"[0-9a-fA-F]{64}", get(side["browser_download_url"]).decode("utf-8", "replace")).group(0)
          actual = hashlib.sha256(data).hexdigest()
          assert actual.lower() == expected.lower(), f"Deno checksum mismatch: {actual} != {expected}"
          zipfile.ZipFile(io.BytesIO(data)).extract(exe, ".")
          os.chmod(exe, os.stat(exe).st_mode | stat.S_IEXEC)
          print("Deno", rel["tag_name"], name, "verified", actual)
          PY
          if [ -f deno.exe ]; then ./deno.exe --version; else ./deno --version; fi

      - name: Build the app
        run: |
          SEP=$(python -c "import os; print(os.pathsep)")
          # A real ffmpeg program (from the imageio-ffmpeg package, GPL) is bundled so downloads work
          # without installing anything; yt-dlp is bundled as a Python package.
          FF=$(python -c "import imageio_ffmpeg,shutil,os; n='ffmpeg.exe' if os.name=='nt' else 'ffmpeg'; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), n); print(n)")
          # Windows: bundle VLC's playback engine (libVLC + plugins, LGPL/GPL) so nobody has to install VLC.
          EXTRA=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            SRC="/c/Program Files/VideoLAN/VLC"
            mkdir -p vlc
            cp "$SRC/libvlc.dll" "$SRC/libvlccore.dll" vlc/
            cp -r "$SRC/plugins" vlc/
            cp "$SRC/COPYING.txt" vlc/VLC-COPYING.txt 2>/dev/null || true
            # Drop what Sevbify never uses (VLC's window, video, casting, ...); see tools/trim_vlc.py.
            python tools/trim_vlc.py vlc
            # Rebuild VLC's plugin list for the trimmed set so the app starts quickly.
            "$SRC/vlc-cache-gen.exe" vlc/plugins || echo "::warning title=VLC::plugin cache not rebuilt"
            du -sh vlc
            EXTRA="--add-data vlc${SEP}vlc"
          fi
          # Sevbify's logo as the program icon (Windows .ico, macOS .icns, Linux .png).
          case "${{ runner.os }}" in
            Windows) ICON=assets/branding/sevbify.ico ;;
            macOS)   ICON=assets/branding/sevbify.icns ;;
            *)       ICON=assets/branding/sevbify_256.png ;;
          esac
          if [ -f deno.exe ]; then EXTRA="$EXTRA --add-binary deno.exe${SEP}."; fi
          # (Git Bash on Windows says "deno" exists when deno.exe does, so only check it elsewhere.)
          if [ "${{ runner.os }}" != "Windows" ] && [ -f deno ]; then EXTRA="$EXTRA --add-binary deno${SEP}."; fi
          pyinstaller --noconfirm --windowed --name Sevbify --icon "$ICON" --collect-all yt_dlp --collect-all yt_dlp_ejs \
            --add-binary "${FF}${SEP}." --add-data "assets${SEP}assets" --add-data "VERSION${SEP}." $EXTRA app.py
          if [ "${{ runner.os }}" = "Linux" ]; then
            # PyInstaller copies libvlc in without VLC's plugins, and that copy can't play anything: remove it so
            # the system's VLC (installed with the package manager, plugins and all) is used.
            rm -fv dist/Sevbify/_internal/libvlc.so* dist/Sevbify/_internal/libvlccore.so*
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS: put VLC's playback engine inside Sevbify.app (same layout as VLC.app: vlc/lib + vlc/plugins),
            # then seal the app again (ad-hoc signature; Apple Silicon refuses to run apps without one).
            SRC="/Applications/VLC.app/Contents/MacOS"
            DST="dist/Sevbify.app/Contents/Frameworks/vlc"
            mkdir -p "$DST/lib"
            cp -RL "$SRC/lib/." "$DST/lib/"
            cp -RL "$SRC/plugins" "$DST/"
            cp "/Applications/VLC.app/Contents/Resources/COPYING" "$DST/VLC-COPYING.txt" 2>/dev/null || true
            ls "$DST/lib"; du -sh "$DST"
            codesign --force --deep --sign - dist/Sevbify.app
            codesign --verify --deep dist/Sevbify.app && echo "signature OK"
          fi

      - name: Check the built app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hide the VLC installed on this machine: the app must play with the copy inside it.
          Rename-Item "C:\Program Files\VideoLAN" "VideoLAN-hidden"
          $p = Start-Process -FilePath "dist\Sevbify\Sevbify.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          $log = Join-Path $env:APPDATA "Sevbify\smoke-test.log"
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host "::notice title=Smoke test::$_" } }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed" }

      - name: Check the built app starts (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Hide the VLC installed on this machine: the app must play with the copy inside it.
            sudo mv /Applications/VLC.app /Applications/VLC-hidden.app
            APP="dist/Sevbify.app/Contents/MacOS/Sevbify"; LOG="$HOME/Library/Application Support/Sevbify/smoke-test.log"
          else
            APP="dist/Sevbify/Sevbify"; LOG="$HOME/.local/share/Sevbify/smoke-test.log"
          fi
          set +e; "$APP" --smoke-test; CODE=$?; set -e
          echo "Exit code: $CODE"; cat "$LOG" 2>/dev/null || true
          if [ -f "$LOG" ]; then while IFS= read -r l; do echo "::notice title=Smoke test (${{ runner.os }})::$l"; done < "$LOG"; fi
          if [ $CODE -ne 0 ]; then
            echo "::error title=Smoke test (${{ runner.os }})::exit code $CODE"
          fi
          exit $CODE

      - name: Why VLC didn't start (only when the check above failed)
        if: failure() && runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then APP="dist/Sevbify.app/Contents/MacOS/Sevbify"; else APP="dist/Sevbify/Sevbify"; fi
          SEVBIFY_VLC_DEBUG=1 "$APP" --smoke-test > vlc-debug.txt 2>&1 || true
          { python -c "import ctypes.util; print('find_library(vlc) =', ctypes.util.find_library('vlc'))"
            echo "Bundled libraries:"; ls dist/Sevbify/_internal 2>/dev/null | grep "\.so" | tr '\n' ' '; echo
            grep -iE "opus|error|cannot|failed|no such|undefined|symbol" vlc-debug.txt | grep -v "lua debug" | sort | uniq -c | sort -rn | head -n 40
            echo ----; tail -n 25 vlc-debug.txt; } > summary.txt
          python - <<'PY'
          t = open("summary.txt", encoding="utf-8", errors="replace").read().splitlines()
          for i in range(0, min(len(t), 72), 8):
              print("::warning title=VLC debug " + str(i // 8) + "::" + "%0A".join(x.replace("%", "%25")[:400] for x in t[i:i + 8]))
          PY

      - name: Package the download
        run: |
          case "${{ runner.os }}" in
            Windows) cp README.md CHANGELOG.md dist/Sevbify/
                     pwsh -Command 'Compress-Archive -Path "dist\Sevbify" -DestinationPath "Sevbify-Windows.zip"' ;;
            macOS)   ditto -c -k --keepParent dist/Sevbify.app Sevbify-macOS.zip ;;
            Linux)   cp README.md CHANGELOG.md packaging/sevbify.desktop packaging/install.sh dist/Sevbify/
                     cp assets/branding/sevbify_256.png dist/Sevbify/sevbify.png
                     tar czf Sevbify-Linux.tar.gz -C dist Sevbify ;;
          esac
          ls -la Sevbify-*

      - uses: actions/upload-artifact@v4
        with:
          name: Sevbify-${{ matrix.name }}
          path: |
            Sevbify-*.zip
            Sevbify-*.tar.gz
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy runs pip with the same Python version the app uses (3.12) to bundle yt-dlp etc.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the APK (shares the repository's core/ with Windows)
        run: |
          set +e
          gradle -p android assembleRelease --stacktrace --no-daemon > gradle.log 2>&1
          code=$?
          tail -n 120 gradle.log
          if [ $code -ne 0 ]; then
            # The errors as a few annotations (readable from the GitHub API): Kotlin errors first, then Gradle's
            # "What went wrong" block.
            { grep -E "^e: " gradle.log; grep -A12 "What went wrong" gradle.log; } | sed 's/%/%25/g' \
              | python3 -c "import sys; t=sys.stdin.read().splitlines(); chunks=['%0A'.join(t[i:i+6]) for i in range(0,len(t),6)][:9]; [print('::error title=Android build::'+c[:3500]) for c in chunks]"
          fi
          exit $code
      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Sevbify-Android.apk
          ls -la Sevbify-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sevbify-Android
          path: Sevbify-Android.apk
          retention-days: 30

  iphone:
    name: iPhone
    needs: plan
    if: needs.plan.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: write          # saves the simulator screenshots to the screens-ios branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get Python for iOS (checksum-checked), the shared code and the Xcode project
        run: |
          brew install xcodegen >/dev/null
          bash ios/prepare.sh
      - name: Build for the iPhone simulator
        run: |
          set +e
          xcodebuild -project ios/Sevbify.xcodeproj -scheme Sevbify -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- build > sim-build.log 2>&1
          code=$?
          tail -n 25 sim-build.log
          if [ $code -ne 0 ]; then
            grep -E "error:|fatal error|Command .* failed" sim-build.log | sort -u | head -40 \
              | while IFS= read -r l; do echo "::error title=iPhone build::${l:0:900}"; done
          fi
          exit $code
      - name: Build the iPhone app (unsigned .ipa for AltStore / SideStore)
        run: |
          set +e
          xcodebuild -project ios/Sevbify.xcodeproj -scheme Sevbify -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath ios/build ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ipa-build.log 2>&1
          code=$?
          tail -n 15 ipa-build.log
          if [ $code -ne 0 ]; then
            grep -E "error:|fatal error|Command .* failed" ipa-build.log | sort -u | head -30 \
              | while IFS= read -r l; do echo "::error title=iPhone (device) build::${l:0:900}"; done
            exit $code
          fi
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Sevbify.app Payload/
          zip -qry Sevbify-iOS.ipa Payload
          ls -la Sevbify-iOS.ipa
          du -sh Payload/Sevbify.app
      - name: Run on the iPhone simulator (Python, online features, screenshots)
        run: |
          bash ios/simulator_check.sh
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("screens/smoke.json"))
          except Exception as e:
              d = {"error": str(e)}
          for k, v in d.items():
              print(f"::notice title=iPhone smoke test::{k}: {json.dumps(v)[:600]}")
          PY
      - name: Save screenshots to the screens-ios branch
        if: always()
        run: |
          [ -d screens ] || exit 0
          cp sim-build.log ipa-build.log screens/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/s && cp -r screens/. /tmp/s/
          git checkout -q --orphan screens-ios-new
          git rm -rq --cached . ; git clean -fdqx
          rm -rf ./* .github 2>/dev/null; cp -r /tmp/s/. .
          git add -A && git commit -qm "iPhone screenshots ${GITHUB_SHA::7}"
          git push -qf origin HEAD:screens-ios
      - uses: actions/upload-artifact@v4
        with:
          name: Sevbify-iOS
          path: Sevbify-iOS.ipa
          retention-days: 30

  release:
    name: Release
    needs: [build, android, iphone]
    if: >-
      always() && needs.build.result == 'success' && needs.android.result == 'success' &&
      (needs.iphone.result == 'success' || needs.iphone.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this a new version to release?
        id: version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$V")" ]; then echo "release=true" >> "$GITHUB_OUTPUT";
          else echo "release=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.release == 'true'
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release (new VERSION or a pushed tag)
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Sevbify ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body_path: RELEASE_NOTES.md
          # Versions with a dash (5.0.0-beta.1) are test versions: marked "Pre-release".
          prerelease: ${{ contains(steps.version.outputs.version, '-') || contains(github.ref_name, '-') }}
          files: |
            artifacts/Sevbify-*.zip
            artifacts/Sevbify-*.tar.gz
            artifacts/Sevbify-*.apk
            artifacts/Sevbify-*.ipa
