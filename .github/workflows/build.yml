name: Build & test

# On every push: runs the automated tests on real Windows (macOS/Linux ready,
# switched off for now — see the matrix below) machines (with VLC installed), builds the app for each, checks the built app
# actually starts and loads a library, and uploads a download for each system.
# Pushing a tag like v5.0 also publishes a GitHub Release with all three.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          # macOS and Linux are ready but switched off until the Windows app is
          # finished (saves GitHub Actions minutes). Remove the "#" to enable:
          # - { name: macOS,   os: macos-latest }
          # - { name: Linux,   os: ubuntu-latest }
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install VLC
        run: |
          case "${{ runner.os }}" in
            Windows) choco install vlc --no-progress -y ;;
            macOS)   brew install --cask vlc ;;
            Linux)   sudo apt-get update -q
                     sudo apt-get install -y -q vlc libvlc-dev libegl1 libgl1 libxkbcommon0 \
                       libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 ;;
          esac

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller imageio-ffmpeg

      - name: Run automated tests
        run: |
          set +e
          python -X faulthandler -m pytest tests -v -p no:cacheprovider > pytest.log 2>&1
          code=$?
          cat pytest.log
          if [ $code -ne 0 ]; then
            tail -n 60 pytest.log | python tools/annotate_tail.py "Tests exited with code $code"
          fi
          exit $code

      - name: Live online check (reports only, never fails the build)
        continue-on-error: true
        run: python tools/online_check.py

      - name: Live download check (reports only, never fails the build)
        continue-on-error: true
        run: python tools/download_check.py

      - name: Build the app
        run: |
          SEP=$(python -c "import os; print(os.pathsep)")
          # A real ffmpeg program (from the imageio-ffmpeg package, GPL) is bundled so downloads work
          # without installing anything; yt-dlp is bundled as a Python package.
          FF=$(python -c "import imageio_ffmpeg,shutil,os; n='ffmpeg.exe' if os.name=='nt' else 'ffmpeg'; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), n); print(n)")
          pyinstaller --noconfirm --windowed --name Sevbify --collect-all yt_dlp \
            --add-binary "${FF}${SEP}." --add-data "assets${SEP}assets" app.py

      - name: Check the built app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Sevbify\Sevbify.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          Write-Host "Exit code: $($p.ExitCode)"
          $log = Join-Path $env:APPDATA "Sevbify\smoke-test.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed" }

      - name: Check the built app starts (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP="dist/Sevbify.app/Contents/MacOS/Sevbify"; LOG="$HOME/Library/Application Support/Sevbify/smoke-test.log"
          else
            APP="dist/Sevbify/Sevbify"; LOG="$HOME/.local/share/Sevbify/smoke-test.log"
          fi
          set +e; "$APP" --smoke-test; CODE=$?; set -e
          echo "Exit code: $CODE"; cat "$LOG" 2>/dev/null || true
          exit $CODE

      - name: Package the download
        run: |
          case "${{ runner.os }}" in
            Windows) cp README.md CHANGELOG.md dist/Sevbify/
                     pwsh -Command 'Compress-Archive -Path "dist\Sevbify" -DestinationPath "Sevbify-Windows.zip"' ;;
            macOS)   ditto -c -k --keepParent dist/Sevbify.app Sevbify-macOS.zip ;;
            Linux)   cp README.md CHANGELOG.md dist/Sevbify/
                     tar czf Sevbify-Linux.tar.gz -C dist Sevbify ;;
          esac
          ls -la Sevbify-*

      - uses: actions/upload-artifact@v4
        with:
          name: Sevbify-${{ matrix.name }}
          path: |
            Sevbify-*.zip
            Sevbify-*.tar.gz
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sevbify ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # Tags with a dash (v5.0.0-beta.1) are test versions: marked "Pre-release".
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            Sevbify-*.zip
            Sevbify-*.tar.gz
